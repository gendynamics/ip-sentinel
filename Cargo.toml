[package]
name = "ip-sentinel-core"
version = "0.1.0"
edition = "2021"
description = "Local-only cryptographic engine for the IP Sentinel UGREEN AI NAS skill"
license = "MIT"

[dependencies]
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# 3.25+ allows getrandom 0.4, which needs edition 2024 / rustc 1.85.
tempfile = ">=3.14, <3.25"
