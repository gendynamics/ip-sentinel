# Code Spell Checker (cSpell) settings, shared by the VS Code extension and the `cspell` CLI.
version: "0.2"
language: en

ignorePaths:
  - .git/**
  - "**/target/**"
  - "**/node_modules/**"
  - "**/__pycache__/**"
  - "**/.pytest_cache/**"
  - Cargo.lock
  # Generated by prototype/demo_prep.py and demo.py
  - prototype/demo_data/**
  - prototype/demo_sentinel_data/**

words:
  # Names: product, platform, organization
  - gendynamics
  - solidcell
  - UGOS
  - UGREEN
  - Uliya
  # UGREEN CLI capability names
  - cpmv
  # Rust, Python and web tooling
  - getrandom
  - novalidate
  - nums
  - pycache
  - pytest
  - replacen
  - rustc
  - serde
  - topbar
  # Everyday technical words missing from the English dictionary
  - hackathon
  - interlayer
  - rescan
  - rescans
  - stylesheet
  - subfolders
  - timestamping
  - transactionally
  - unreviewed
  # STEP (ISO 10303-21) CAD file keyword used in the demo data
  - ENDSEC
